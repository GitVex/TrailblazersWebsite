services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    restart: unless-stopped
    environment:
      POLL_INTERVAL: 60
      KEEP_BUILDS: 5
    volumes:
      - /srv/tb_wiki/staging/Obsidian/Trailblazers/Trailblazers:/content:ro
      - /srv/tb_wiki/output:/output
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_WEB_8100
    volumes:
      - /srv/tb_wiki/output:/output:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8100/"]
      interval: 30s
      timeout: 3s
      retries: 3